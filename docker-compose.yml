services:
  db:
    image: postgres:15-alpine
    container_name: codesdev-db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./codesdev/server
    container_name: codesdev-server
    restart: always
    user: root
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CLIENT_URL: ${CLIENT_URL} 
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  client:
    build:
      context: ./codesdev/client
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: codesdev-client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./codesdev/client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server

  python-runner:
    image: codesdev-python-runner
    build:
      context: .
      dockerfile: Dockerfile.python-runner

volumes:
  postgres_data: